<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Terminal Window Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#080C10" stroke="url(#cyberGrad)" stroke-width="3"/>
  
  <!-- Subtle Grid Accent -->
  <line x1="4" y1="36" x2="124" y2="36" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="4" fill="#EF4444"/>
  <circle cx="38" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="52" cy="20" r="4" fill="#10B981"/>
  
  <!-- Terminal Prompt Symbol >_ -->
  <path d="M 32 54 L 54 74 L 32 94" fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <line x1="68" y1="94" x2="96" y2="94" stroke="#00F5A0" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
</svg>
