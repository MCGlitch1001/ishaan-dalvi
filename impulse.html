        // =========================================================================
        // 4. STUDIO PBR MATERIALS & PROCEDURAL SOFTBOX ENVIRONMENT MAP
        // =========================================================================

        /**
         * Creates a procedural studio softbox environment texture via PMREMGenerator
         * so metallic rims, aluminum swingarm, chrome forks, and glossy paint reflect naturally.
         */
        function createStudioEnvironment(renderer) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();

            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x686e78);

            // Large overhead studio softbox
            const topBox = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 14),
                new THREE.MeshBasicMaterial({ color: 0xf0f2f5, side: THREE.DoubleSide })
            );
            topBox.position.set(0, 7, 0);
            topBox.rotation.x = Math.PI / 2;
            envScene.add(topBox);

            // Warm right-side studio reflector strip
            const rightCard = new THREE.Mesh(
                new THREE.PlaneGeometry(10, 6),
                new THREE.MeshBasicMaterial({ color: 0xece6dd, side: THREE.DoubleSide })
            );
            rightCard.position.set(4, 3, 7);
            rightCard.lookAt(0, 1, 0);
            envScene.add(rightCard);

            // Cool left-side fill reflector
            const leftCard = new THREE.Mesh(
                new THREE.PlaneGeometry(10, 6),
                new THREE.MeshBasicMaterial({ color: 0xcad6e8, side: THREE.DoubleSide })
            );
            leftCard.position.set(-4, 3, -7);
            leftCard.lookAt(0, 1, 0);
            envScene.add(leftCard);

            // Darker horizon strip for richer metallic and painted contrast
            const band = new THREE.Mesh(
                new THREE.CylinderGeometry(10, 10, 1.8, 24, 1, true),
                new THREE.MeshBasicMaterial({ color: 0x464b54, side: THREE.BackSide })
            );
            band.position.y = 0.2;
            envScene.add(band);

            const envRT = pmrem.fromScene(envScene, 0.035);
            pmrem.dispose();
            return envRT.texture;
        }

        /**
         * Builds the physically-based material library tuned for voxel studio rendering.
         * Note: Base colors remain 0xffffff because per-voxel colors & AO are applied via instanceColor.
         */
        function createMaterials(envMap) {
            const mk = (roughness, metalness, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({
                color: 0xffffff,
                roughness,
                metalness,
                envMap,
                envMapIntensity: 0.72
            }, extra));

            return {
                glossyPaint:    mk(0.24, 0.08, { envMapIntensity: 0.65 }),
                metallicSilver: mk(0.28, 0.80, { envMapIntensity: 1.10 }),
                chrome:         mk(0.14, 0.92, { envMapIntensity: 1.30 }),
                engineAlloy:    mk(0.42, 0.62, { envMapIntensity: 0.85 }),
                rubberMatte:    mk(0.88, 0.02, { envMapIntensity: 0.18 }),
                siliconeRed:    mk(0.46, 0.04, { envMapIntensity: 0.38 }),
                darkMetal:      mk(0.50, 0.44, { envMapIntensity: 0.55 }),
                exhaustBronze:  mk(0.44, 0.66, { envMapIntensity: 0.85 }),
                leatherBrown:   mk(0.84, 0.02, { envMapIntensity: 0.20 }),
                reflectorAmber: mk(0.15, 0.10, { emissive: new THREE.Color(0x2e1100), envMapIntensity: 1.0 })
            };
        }

        // =========================================================================
        // 5. SMOOTH DAMPED ORBIT / ZOOM / PAN CONTROLLER (MOUSE + TOUCH)
        // =========================================================================

        class StudioOrbitController {
            constructor(camera, domElement) {
                this.camera = camera;
                this.dom = domElement;

                // Spherical coordinates around target
                this.target = new THREE.Vector3(-0.02, 0.61, 0.0);
                this.targetGoal = this.target.clone();

                // Initial viewing angle faithfully matching reference photo (right-side profile)
                this.defaultTheta = 0.025;      // Pure right-side (+Z) with tiny natural depth cue
                this.defaultPhi = Math.PI * 0.488; // Eye-level low-mid stance matching photo horizon
                this.defaultRadius = 3.55;

                this.theta = this.defaultTheta;
                this.phi = this.defaultPhi;
                this.radius = this.defaultRadius;

                this.thetaGoal = this.theta;
                this.phiGoal = this.phi;
                this.radiusGoal = this.radius;

                this.dragging = false;
                this.panning = false;
                this.lastX = 0;
                this.lastY = 0;
                this.pinchDist = 0;
                this.lastTapTime = 0;

                this._bindEvents();
                this.fitToViewport();
                this.snapImmediate();
            }

            /** Automatically computes camera radius so the entire bike fits with clean margins on any screen */
            fitToViewport() {
                const aspect = window.innerWidth / Math.max(1, window.innerHeight);
                const vFovRad = this.camera.fov * Math.PI / 180;
                const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);

                // Motorcycle total visual span: ~2.15m wide (X), ~1.35m tall (Y)
                const halfSpanX = 1.28;
                const halfSpanY = 0.80;

                const distH = halfSpanX / Math.tan(hFovRad / 2);
                const distV = halfSpanY / Math.tan(vFovRad / 2);
                this.defaultRadius = Math.max(distH, distV);
                this.radiusGoal = this.defaultRadius;
            }

            resetView() {
                this.thetaGoal = this.defaultTheta;
                this.phiGoal = this.defaultPhi;
                this.radiusGoal = this.defaultRadius;
                this.targetGoal.set(-0.02, 0.61, 0.0);
            }

            snapImmediate() {
                this.theta = this.thetaGoal;
                this.phi = this.phiGoal;
                this.radius = this.radiusGoal;
                this.target.copy(this.targetGoal);
                this._applyCamera();
            }

            update() {
                const damp = 0.12;
                this.theta += (this.thetaGoal - this.theta) * damp;
                this.phi += (this.phiGoal - this.phi) * damp;
                this.radius += (this.radiusGoal - this.radius) * damp;
                this.target.lerp(this.targetGoal, damp);
                this._applyCamera();
            }

            _applyCamera() {
                const sinPhi = Math.sin(this.phi);
                const x = this.target.x + this.radius * sinPhi * Math.sin(this.theta);
                const y = this.target.y + this.radius * Math.cos(this.phi);
                const z = this.target.z + this.radius * sinPhi * Math.cos(this.theta);
                this.camera.position.set(x, Math.max(0.06, y), z);
                this.camera.lookAt(this.target);
            }

            _pan(dx, dy) {
                const panScale = this.radius * 0.0014;
                const forward = new THREE.Vector3();
                this.camera.getWorldDirection(forward);
                const right = new THREE.Vector3().crossVectors(forward, this.camera.up).normalize();
                const up = new THREE.Vector3().crossVectors(right, forward).normalize();
                this.targetGoal.addScaledVector(right, -dx * panScale);
                this.targetGoal.addScaledVector(up, dy * panScale);
                this.targetGoal.y = Math.max(0.15, Math.min(1.4, this.targetGoal.y));
            }

            _bindEvents() {
                // Mouse interaction
                this.dom.addEventListener('mousedown', (e) => {
                    this.dragging = true;
                    this.panning = (e.button === 2 || e.shiftKey);
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.dragging) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;

                    if (this.panning) {
                        this._pan(dx, dy);
                    } else {
                        this.thetaGoal -= dx * 0.0068;
                        this.phiGoal = Math.max(0.14, Math.min(Math.PI * 0.535, this.phiGoal - dy * 0.0068));
                    }
                });

                window.addEventListener('mouseup', () => {
                    this.dragging = false;
                    this.panning = false;
                });

                this.dom.addEventListener('contextmenu', (e) => e.preventDefault());

                this.dom.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = 1 + Math.sign(e.deltaY) * 0.09;
                    this.radiusGoal = Math.max(1.15, Math.min(9.5, this.radiusGoal * factor));
                }, { passive: false });

                this.dom.addEventListener('dblclick', () => this.resetView());

                // Touch interaction (1-finger rotate, 2-finger pinch zoom & pan, double-tap reset)
                this.dom.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1) {
                        const now = performance.now();
                        if (now - this.lastTapTime < 280) {
                            this.resetView();
                        }
                        this.lastTapTime = now;
                        this.dragging = true;
                        this.panning = false;
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        this.dragging = false;
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.pinchDist = Math.hypot(dx, dy);
                        this.lastX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
                        this.lastY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
                    }
                }, { passive: false });

                this.dom.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1 && this.dragging) {
                        const dx = e.touches[0].clientX - this.lastX;
                        const dy = e.touches[0].clientY - this.lastY;
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                        this.thetaGoal -= dx * 0.0075;
                        this.phiGoal = Math.max(0.14, Math.min(Math.PI * 0.535, this.phiGoal - dy * 0.0075));
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        if (this.pinchDist > 0) {
                            const scale = this.pinchDist / Math.max(1, dist);
                            this.radiusGoal = Math.max(1.15, Math.min(9.5, this.radiusGoal * scale));
                        }
                        this.pinchDist = dist;

                        const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
                        const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
                        this._pan(midX - this.lastX, midY - this.lastY);
                        this.lastX = midX;
                        this.lastY = midY;
                    }
                }, { passive: false });

                this.dom.addEventListener('touchend', () => {
                    this.dragging = false;
                    this.pinchDist = 0;
                });
            }
        }

        // =========================================================================
        // 6. SCENE ASSEMBLY, STUDIO LIGHTING & RENDER LOOP
        // =========================================================================

        function initScene() {
            const canvas = document.getElementById('viewport');

            // Renderer with high-DPI support, ACES Filmic tone mapping & soft shadows
            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight, false);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.94;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Plain seamless mid-dark neutral studio grey backdrop
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5e646e);

            // Studio Environment Map & Materials
            const envMap = createStudioEnvironment(renderer);
            scene.environment = envMap;
            const materials = createMaterials(envMap);

            // Camera (34 deg FOV ~ 55mm telephoto lens for faithful profile proportions)
            const camera = new THREE.PerspectiveCamera(
                34,
                window.innerWidth / Math.max(1, window.innerHeight),
                0.08,
                40
            );

            // Studio 3-Point + Hemisphere Lighting Rig (balanced for rich color saturation)
            const hemiLight = new THREE.HemisphereLight(0xf5f7fa, 0x3b4048, 0.42);
            scene.add(hemiLight);

            // Key studio softbox light (front-right-above, casting crisp grounded voxel shadows)
            const keyLight = new THREE.DirectionalLight(0xfff9f0, 1.42);
            keyLight.position.set(1.8, 4.6, 3.2);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 1.0;
            keyLight.shadow.camera.far = 11.0;
            keyLight.shadow.camera.left = -1.65;
            keyLight.shadow.camera.right = 1.65;
            keyLight.shadow.camera.top = 1.65;
            keyLight.shadow.camera.bottom = -1.65;
            keyLight.shadow.bias = -0.00045;
            keyLight.shadow.radius = 2.4;
            scene.add(keyLight);

            // Cool opposite fill light (ensures left side and dark mechanical recesses stay detailed)
            const fillLight = new THREE.DirectionalLight(0xdce7ff, 0.52);
            fillLight.position.set(-2.5, 2.8, -3.4);
            scene.add(fillLight);

            // Rear rim light for clean silhouette separation against the studio grey backdrop
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.58);
            rimLight.position.set(-3.2, 2.2, 1.4);
            scene.add(rimLight);

            // Invisible shadow-catching ground plane at Y = 0 (seamlessly merges into studio grey)
            const floorGeo = new THREE.PlaneGeometry(16, 16);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.34 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            scene.add(floor);

            // Procedurally construct every logical component of the Hero Impulse in 3D voxels
            const builder = new VoxelMotorcycleBuilder();

            // Rear Knobby Wheel (17" visual proportion)
            buildOffroadWheel(builder, {
                groupName: 'RearWheel',
                cx: BIKE.rearAxleX,
                cy: BIKE.rearAxleY,
                outerR: BIKE.rearTireR,
                rimR: BIKE.rearRimR,
                halfTireW: 0.062,
                hubR: 0.068,
                hubHalfW: 0.068,
                spokeCount: 36,
                isFront: false
            });

            // Front Knobby Wheel (19" visual proportion + right-side perforated brake disc & caliper)
            buildOffroadWheel(builder, {
                groupName: 'FrontWheel',
                cx: BIKE.frontAxleX,
                cy: BIKE.frontAxleY,
                outerR: BIKE.frontTireR,
                rimR: BIKE.frontRimR,
                halfTireW: 0.048,
                hubR: 0.052,
                hubHalfW: 0.056,
                spokeCount: 36,
                isFront: true
            });

            buildFrontForksAndCockpit(builder);
            buildFenders(builder);
            buildFuelTankAndShrouds(builder);
            buildSeatAndSidePanels(builder);
            buildFrameEngineAndControls(builder);
            buildSwingarmAndSuspension(builder);
            buildExhaustSystem(builder);

            // Compile all logical groups into optimized InstancedMeshes with baked voxel AO
            const motorcycleGroup = builder.compile(materials);

            // Apply subtle natural kickstand lean matching the reference photograph
            motorcycleGroup.rotation.x = BIKE.leanAngleRad;
            // Re-seat lowest point cleanly onto Y = 0 studio floor
            motorcycleGroup.updateMatrixWorld(true);
            const bbox = new THREE.Box3().setFromObject(motorcycleGroup);
            motorcycleGroup.position.y -= bbox.min.y;
            scene.add(motorcycleGroup);

            // Interactive Studio Camera Controls
            const controls = new StudioOrbitController(camera, canvas);

            // Responsive Resize Handler
            window.addEventListener('resize', () => {
                const w = window.innerWidth;
                const h = Math.max(1, window.innerHeight);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h, false);
                controls.fitToViewport();
            });

            // Main Render Loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        // Start safely after window load
        window.onload = function () {
            try {
                initScene();
            } catch (err) {
                console.error('Failed to initialize 3D voxel scene:', err);
            }
        };
    })();
    </script>
