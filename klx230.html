<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawasaki KLX 230R - 3D Voxel Model</title>
    <!-- Three.js r128 Core Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Clean, borderless full-viewport studio canvas presentation */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c626b;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #viewport {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        #viewport:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <!-- Main WebGL Rendering Canvas -->
    <canvas id="viewport"></canvas>

    <script>
    (function () {
        'use strict';

        // =========================================================================
        // 1. MULTI-RESOLUTION VOXEL CONSTANTS & MATERIAL PALETTE
        // =========================================================================
        // Three distinct physical cube sizes (in meters) balance fine mechanical
        // fidelity (spokes, fins, rotors, decals) with clean voxel aesthetics.
        const S_MAIN = 0.0125;  // 12.5 mm: bodywork panels, seat, tires, muffler, swingarm
        const S_MED  = 0.0090;  //  9.0 mm: frame tubes, forks, gaiters, engine, exhaust, knobs
        const S_FINE = 0.0056;  //  5.6 mm: wire spokes, cooling fins, petal discs, bolts, chain

        // Accurate PBR material definitions sampled from the reference Kawasaki KLX 230R
        const MATERIAL_SPECS = {
            limeGreen:      { color: 0x45c814, roughness: 0.24, metalness: 0.05 },
            limeGreenDark:  { color: 0x35a80d, roughness: 0.28, metalness: 0.05 },
            seatBlack:      { color: 0x222427, roughness: 0.82, metalness: 0.02 },
            tankBlack:      { color: 0x1b1d20, roughness: 0.36, metalness: 0.06 },
            decalBlack:     { color: 0x15171a, roughness: 0.26, metalness: 0.06 },
            decalWhite:     { color: 0xedf1f4, roughness: 0.24, metalness: 0.12 },
            frameWhite:     { color: 0xdce0e4, roughness: 0.36, metalness: 0.24 },
            frameGuard:     { color: 0x393c41, roughness: 0.56, metalness: 0.06 },
            tireRubber:     { color: 0x2d2f31, roughness: 0.90, metalness: 0.02 },
            tireDust:       { color: 0x45443f, roughness: 0.94, metalness: 0.01 },
            rimBlack:       { color: 0x16181c, roughness: 0.25, metalness: 0.78 },
            aluminum:       { color: 0xc5cacf, roughness: 0.30, metalness: 0.84 },
            aluminumCast:   { color: 0xa1a6ab, roughness: 0.44, metalness: 0.70 },
            chrome:         { color: 0xe3e8ed, roughness: 0.11, metalness: 0.96 },
            spokeSteel:     { color: 0xd0d5da, roughness: 0.22, metalness: 0.90 },
            cylinderOxide:  { color: 0x766c60, roughness: 0.62, metalness: 0.46 },
            exhaustHeader:  { color: 0x765540, roughness: 0.56, metalness: 0.54 },
            mufflerSteel:   { color: 0xd0d4d8, roughness: 0.24, metalness: 0.88 },
            mufflerCap:     { color: 0x3a3d41, roughness: 0.54, metalness: 0.48 },
            gaiterRubber:   { color: 0x38322a, roughness: 0.86, metalness: 0.02 },
            gripTan:        { color: 0xba9b6e, roughness: 0.82, metalness: 0.02 },
            darkSteel:      { color: 0x2c2f34, roughness: 0.40, metalness: 0.74 },
            strapBlack:     { color: 0x1c1e21, roughness: 0.88, metalness: 0.02 }
        };

        // =========================================================================
        // 2. VOXEL STORAGE, DEDUPLICATION & AMBIENT OCCLUSION ENGINE
        // =========================================================================
        /**
         * VoxelLayer stores quantized 3D voxel cubes for a specific logical component
         * at a specific voxel resolution, performs interior-face culling, and converts
         * the data into optimized THREE.InstancedMesh objects with per-voxel AO.
         */
        class VoxelLayer {
            constructor(size, jitter = 0.03) {
                this.size = size;
                this.jitter = jitter;
                this.voxels = new Map(); // key "ix,iy,iz" -> { ix, iy, iz, mat, tint }
            }

            /** Add a single voxel at local coordinates (x, y, z) */
            set(x, y, z, mat, tint = 1.0) {
                const ix = Math.round(x / this.size);
                const iy = Math.round(y / this.size);
                const iz = Math.round(z / this.size);
                const key = ix + ',' + iy + ',' + iz;
                this.voxels.set(key, { ix, iy, iz, mat, tint });
            }

            /** Add a voxel only if the cell is currently empty */
            setIfEmpty(x, y, z, mat, tint = 1.0) {
                const ix = Math.round(x / this.size);
                const iy = Math.round(y / this.size);
                const iz = Math.round(z / this.size);
                const key = ix + ',' + iy + ',' + iz;
                if (!this.voxels.has(key)) {
                    this.voxels.set(key, { ix, iy, iz, mat, tint });
                }
            }

            /** Fill a 3D cylindrical tube/capsule between point A and point B */
            addTube(ax, ay, az, bx, by, bz, radius, mat, hollow = false, tint = 1.0) {
                const s = this.size;
                const dx = bx - ax, dy = by - ay, dz = bz - az;
                const lenSq = dx * dx + dy * dy + dz * dz;
                const pad = radius + s;
                const minX = Math.floor((Math.min(ax, bx) - pad) / s);
                const maxX = Math.ceil((Math.max(ax, bx) + pad) / s);
                const minY = Math.floor((Math.min(ay, by) - pad) / s);
                const maxY = Math.ceil((Math.max(ay, by) + pad) / s);
                const minZ = Math.floor((Math.min(az, bz) - pad) / s);
                const maxZ = Math.ceil((Math.max(az, bz) + pad) / s);
                const rSq = radius * radius;
                const innerRSq = hollow ? Math.pow(Math.max(0, radius - s * 1.35), 2) : -1;

                for (let ix = minX; ix <= maxX; ix++) {
                    const px = ix * s;
                    for (let iy = minY; iy <= maxY; iy++) {
                        const py = iy * s;
                        for (let iz = minZ; iz <= maxZ; iz++) {
                            const pz = iz * s;
                            let t = 0;
                            if (lenSq > 1e-8) {
                                t = ((px - ax) * dx + (py - ay) * dy + (pz - az) * dz) / lenSq;
                                if (t < 0) t = 0;
                                else if (t > 1) t = 1;
                            }
                            const cx = ax + t * dx - px;
                            const cy = ay + t * dy - py;
                            const cz = az + t * dz - pz;
                            const dSq = cx * cx + cy * cy + cz * cz;
                            if (dSq <= rSq && dSq >= innerRSq) {
                                const key = ix + ',' + iy + ',' + iz;
                                this.voxels.set(key, { ix, iy, iz, mat, tint });
                            }
                        }
                    }
                }
            }

            /** Fill a tapered cone/cylinder between point A (radius rA) and point B (radius rB) */
            addTaperedTube(ax, ay, az, bx, by, bz, rA, rB, mat, tint = 1.0) {
                const s = this.size;
                const dx = bx - ax, dy = by - ay, dz = bz - az;
                const lenSq = dx * dx + dy * dy + dz * dz;
                const maxR = Math.max(rA, rB);
                const pad = maxR + s;
                const minX = Math.floor((Math.min(ax, bx) - pad) / s);
                const maxX = Math.ceil((Math.max(ax, bx) + pad) / s);
                const minY = Math.floor((Math.min(ay, by) - pad) / s);
                const maxY = Math.ceil((Math.max(ay, by) + pad) / s);
                const minZ = Math.floor((Math.min(az, bz) - pad) / s);
                const maxZ = Math.ceil((Math.max(az, bz) + pad) / s);

                for (let ix = minX; ix <= maxX; ix++) {
                    const px = ix * s;
                    for (let iy = minY; iy <= maxY; iy++) {
                        const py = iy * s;
                        for (let iz = minZ; iz <= maxZ; iz++) {
                            const pz = iz * s;
                            let t = 0;
                            if (lenSq > 1e-8) {
                                t = ((px - ax) * dx + (py - ay) * dy + (pz - az) * dz) / lenSq;
                                if (t < 0) t = 0;
                                else if (t > 1) t = 1;
                            }
                            const r = rA + (rB - rA) * t;
                            const cx = ax + t * dx - px;
                            const cy = ay + t * dy - py;
                            const cz = az + t * dz - pz;
                            if (cx * cx + cy * cy + cz * cz <= r * r) {
                                const key = ix + ',' + iy + ',' + iz;
                                this.voxels.set(key, { ix, iy, iz, mat, tint });
                            }
                        }
                    }
                }
            }

            /** Fill a polyline of connected cylindrical segments */
            addPolyline(points, radius, mat, tint = 1.0) {
                for (let i = 0; i < points.length - 1; i++) {
                    const a = points[i], b = points[i + 1];
                    this.addTube(a[0], a[1], a[2], b[0], b[1], b[2], radius, mat, false, tint);
                }
            }

            /** Fill an axis-aligned rectangular box */
            addBox(x0, y0, z0, x1, y1, z1, mat, tint = 1.0) {
                const s = this.size;
                const minX = Math.round(Math.min(x0, x1) / s);
                const maxX = Math.round(Math.max(x0, x1) / s);
                const minY = Math.round(Math.min(y0, y1) / s);
                const maxY = Math.round(Math.max(y0, y1) / s);
                const minZ = Math.round(Math.min(z0, z1) / s);
                const maxZ = Math.round(Math.max(z0, z1) / s);
                for (let ix = minX; ix <= maxX; ix++) {
                    for (let iy = minY; iy <= maxY; iy++) {
                        for (let iz = minZ; iz <= maxZ; iz++) {
                            const key = ix + ',' + iy + ',' + iz;
                            this.voxels.set(key, { ix, iy, iz, mat, tint });
                        }
                    }
                }
            }

            /** Fill a 3D ellipsoid */
            addEllipsoid(cx, cy, cz, rx, ry, rz, mat, tint = 1.0) {
                const s = this.size;
                const minX = Math.floor((cx - rx) / s), maxX = Math.ceil((cx + rx) / s);
                const minY = Math.floor((cy - ry) / s), maxY = Math.ceil((cy + ry) / s);
                const minZ = Math.floor((cz - rz) / s), maxZ = Math.ceil((cz + rz) / s);
                for (let ix = minX; ix <= maxX; ix++) {
                    const nx = (ix * s - cx) / rx;
                    const nx2 = nx * nx;
                    if (nx2 > 1) continue;
                    for (let iy = minY; iy <= maxY; iy++) {
                        const ny = (iy * s - cy) / ry;
                        const ny2 = nx2 + ny * ny;
                        if (ny2 > 1) continue;
                        for (let iz = minZ; iz <= maxZ; iz++) {
                            const nz = (iz * s - cz) / rz;
                            if (ny2 + nz * nz <= 1) {
                                const key = ix + ',' + iy + ',' + iz;
                                this.voxels.set(key, { ix, iy, iz, mat, tint });
                            }
                        }
                    }
                }
            }

            /**
             * Build InstancedMesh objects for this layer, culling hidden interior voxels
             * and baking realistic local 3D neighbor ambient occlusion into instance colors.
             */
            buildInstancedMeshes(sharedBoxGeo, materialsMap, targetGroup) {
                const byMat = new Map();
                const map = this.voxels;

                // 1. Cull completely occluded interior voxels & compute 26-neighbor AO
                for (const [, v] of map) {
                    const { ix, iy, iz } = v;
                    const nXP = map.has((ix + 1) + ',' + iy + ',' + iz);
                    const nXM = map.has((ix - 1) + ',' + iy + ',' + iz);
                    const nYP = map.has(ix + ',' + (iy + 1) + ',' + iz);
                    const nYM = map.has(ix + ',' + (iy - 1) + ',' + iz);
                    const nZP = map.has(ix + ',' + iy + ',' + (iz + 1));
                    const nZM = map.has(ix + ',' + iy + ',' + (iz - 1));

                    // Skip completely buried interior cubes for high performance
                    if (nXP && nXM && nYP && nYM && nZP && nZM) continue;

                    // Count local 26-connected neighbors for smooth voxel ambient occlusion
                    let occ = 0;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dz = -1; dz <= 1; dz++) {
                                if (dx === 0 && dy === 0 && dz === 0) continue;
                                if (map.has((ix + dx) + ',' + (iy + dy) + ',' + (iz + dz))) {
                                    // Slightly higher weight for upward occlusion (sky blocking)
                                    occ += (dy > 0) ? 1.25 : 0.85;
                                }
                            }
                        }
                    }
                    // Normalize AO into realistic shadow falloff range [0.64, 1.03]
                    const ao = Math.max(0.64, Math.min(1.03, 1.04 - (occ / 22.0) * 0.36));

                    // Deterministic subtle micro-variation per voxel for tactile realism
                    const hash = Math.sin(ix * 12.9898 + iy * 78.233 + iz * 37.719) * 43758.5453;
                    const noise = (hash - Math.floor(hash) - 0.5) * 2.0 * this.jitter;
                    const shade = Math.max(0.45, Math.min(1.12, ao * v.tint * (1.0 + noise)));

                    if (!byMat.has(v.mat)) byMat.set(v.mat, []);
                    byMat.get(v.mat).push({
                        x: ix * this.size,
                        y: iy * this.size,
                        z: iz * this.size,
                        shade
                    });
                }

                // 2. Construct one InstancedMesh per material for minimal WebGL draw calls
                const dummy = new THREE.Object3D();
                const tmpColor = new THREE.Color();
                // Micro-seam (0.985) lets studio lighting catch individual voxel cube bevels
                const cubeScale = this.size * 0.986;

                for (const [matKey, list] of byMat) {
                    const mat = materialsMap[matKey];
                    const inst = new THREE.InstancedMesh(sharedBoxGeo, mat, list.length);
                    inst.castShadow = true;
                    inst.receiveShadow = true;

                    for (let i = 0; i < list.length; i++) {
                        const item = list[i];
                        dummy.position.set(item.x, item.y, item.z);
                        dummy.scale.set(cubeScale, cubeScale, cubeScale);
                        dummy.updateMatrix();
                        inst.setMatrixAt(i, dummy.matrix);

                        // Per-instance multiplicative color (white * AO * tint)
                        tmpColor.setRGB(item.shade, item.shade, item.shade);
                        inst.setColorAt(i, tmpColor);
                    }
                    inst.instanceMatrix.needsUpdate = true;
                    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
                    targetGroup.add(inst);
                }
            }
        }

        // =========================================================================
        // 3. GRAPHICS / DECAL BITMAP SAMPLER FOR "KLX" AND "230R" SHROUD GRAPHICS
        // =========================================================================
        // Compact pixel-art font for authentic voxelized Kawasaki shroud decals
        const DECAL_KLX = [
            "1001001000010001",
            "1010001000001010",
            "1100001000000100",
            "1010001000001010",
            "1001001111010001"
        ];
        const DECAL_230R = [
            "1110011100111001110",
            "0001000010100101001",
            "0110001100100101110",
            "1000000010100101010",
            "1111011100111001001"
        ];

        function sampleBitmap(bitmap, u, v) {
            if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
            const rows = bitmap.length;
            const cols = bitmap[0].length;
            const r = Math.min(rows - 1, Math.floor((1 - v) * rows));
            const c = Math.min(cols - 1, Math.floor(u * cols));
            return bitmap[r][c] === '1';
        }

        // =========================================================================
        // 4. PROCEDURAL STUDIO ENVIRONMENT MAP (PMREM SOFTBOX LIGHTING)
        // =========================================================================
        function createStudioEnvironment(renderer) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();

            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x525760);

            // Overhead primary studio softbox
            const topBox = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 10),
                new THREE.MeshBasicMaterial({ color: 0xfafcff, side: THREE.DoubleSide })
            );
            topBox.position.set(0, 6.5, 0);
            topBox.rotation.x = Math.PI / 2;
            envScene.add(topBox);

            // Right-front warm key softbox (illuminates the chrome, aluminum, & lime plastics)
            const keyBox = new THREE.Mesh(
                new THREE.PlaneGeometry(8, 5),
                new THREE.MeshBasicMaterial({ color: 0xfff8ee, side: THREE.DoubleSide })
            );
            keyBox.position.set(3.5, 3.2, 6.0);
            keyBox.lookAt(0, 0.5, 0);
            envScene.add(keyBox);

            // Left-rear cool rim reflector strip
            const rimBox = new THREE.Mesh(
                new THREE.PlaneGeometry(9, 4),
                new THREE.MeshBasicMaterial({ color: 0xdce6f5, side: THREE.DoubleSide })
            );
            rimBox.position.set(-4.0, 3.6, -5.5);
            rimBox.lookAt(0, 0.5, 0);
            envScene.add(rimBox);

            // Darker contrast floor bounce so chrome, metals, and plastics show deep reflections
            const floorStrip = new THREE.Mesh(
                new THREE.PlaneGeometry(18, 18),
                new THREE.MeshBasicMaterial({ color: 0x383c42, side: THREE.DoubleSide })
            );
            floorStrip.position.set(0, -3.5, 0);
            floorStrip.rotation.x = -Math.PI / 2;
            envScene.add(floorStrip);

            const envRT = pmrem.fromScene(envScene, 0.04);
            pmrem.dispose();
            return envRT.texture;
        }

        // =========================================================================
        // 5. COMPONENT BUILDERS FOR THE KAWASAKI KLX 230R
        // =========================================================================

        /**
         * Build a complete off-road dirt-bike wheel (21" front or 18" rear) with:
         * - Knobby tire carcass & staggered 3D center/shoulder rubber tread blocks
         * - Black anodized aluminum rim
         * - Brushed aluminum hub
         * - 36 fine crossed wire spokes (left & right flanges)
         * - Wave/petal stainless brake disc rotor
         * - Optional rear chain sprocket (for rear wheel)
         */
        function buildWheel(group, sharedBoxGeo, materials, cfg) {
            const main = new VoxelLayer(S_MAIN, 0.035);
            const med  = new VoxelLayer(S_MED,  0.035);
            const fine = new VoxelLayer(S_FINE, 0.020);

            const {
                outerR, tireInnerR, rimInnerR,
                tireWidth, rimWidth, hubR, hubWidth,
                knobPitches, discSide, discR,
                hasSprocket, sprocketR
            } = cfg;

            const carcassR = outerR - 0.023;
            const halfTireW = tireWidth * 0.5;
            const halfRimW = rimWidth * 0.5;

            // 1. Tire carcass (rounded cross-section torus in S_MAIN voxels)
            const tireCenterR = (carcassR + tireInnerR) * 0.5;
            const tireTubeR   = (carcassR - tireInnerR) * 0.5;
            const minI = Math.floor(-carcassR / S_MAIN);
            const maxI = Math.ceil(carcassR / S_MAIN);
            const maxZ = Math.ceil(halfTireW / S_MAIN);

            for (let ix = minI; ix <= maxI; ix++) {
                const x = ix * S_MAIN;
                for (let iy = minI; iy <= maxI; iy++) {
                    const y = iy * S_MAIN;
                    const r = Math.hypot(x, y);
                    if (r < tireInnerR - S_MAIN || r > carcassR + S_MAIN) continue;
                    const dr = (r - tireCenterR) / tireTubeR;
                    for (let iz = -maxZ; iz <= maxZ; iz++) {
                        const z = iz * S_MAIN;
                        const dz = z / halfTireW;
                        if (dr * dr * 0.92 + dz * dz <= 1.0 && r >= tireInnerR) {
                            // Subtle dusty tone closer to outer tread
                            const isOuter = r > carcassR - 0.018;
                            main.set(x, y, z, isOuter ? 'tireRubber' : 'tireRubber', isOuter ? 1.06 : 0.96);
                        }
                    }
                }
            }

            // 2. Aggressive Knobby Off-Road Tread Blocks (S_MED voxels)
            for (let i = 0; i < knobPitches; i++) {
                const ang = (i / knobPitches) * Math.PI * 2;
                const ca = Math.cos(ang), sa = Math.sin(ang);
                const tx = -sa, ty = ca; // tangent

                // Alternating center & intermediate/shoulder motocross tread blocks
                const pattern = i % 2;
                const blocks = pattern === 0
                    ? [
                        { z: 0, w: 0.022, len: 0.015, h: 0.024, tilt: 0 },
                        { z:  halfTireW * 0.72, w: 0.015, len: 0.016, h: 0.021, tilt:  0.18 },
                        { z: -halfTireW * 0.72, w: 0.015, len: 0.016, h: 0.021, tilt: -0.18 }
                      ]
                    : [
                        { z:  halfTireW * 0.36, w: 0.017, len: 0.015, h: 0.023, tilt:  0.07 },
                        { z: -halfTireW * 0.36, w: 0.017, len: 0.015, h: 0.023, tilt: -0.07 },
                        { z:  halfTireW * 0.85, w: 0.013, len: 0.014, h: 0.018, tilt:  0.26 },
                        { z: -halfTireW * 0.85, w: 0.013, len: 0.014, h: 0.018, tilt: -0.26 }
                      ];

                for (const b of blocks) {
                    const baseR = carcassR - 0.005 - Math.abs(b.tilt) * 0.032;
                    for (let dr = 0; dr <= b.h; dr += S_MED * 0.85) {
                        const r = baseR + dr;
                        const isTip = dr > b.h * 0.55;
                        for (let dt = -b.len * 0.5; dt <= b.len * 0.5; dt += S_MED * 0.85) {
                            for (let dz = -b.w * 0.5; dz <= b.w * 0.5; dz += S_MED * 0.85) {
                                const px = ca * r + tx * dt;
                                const py = sa * r + ty * dt;
                                const pz = b.z + dz + dr * b.tilt;
                                med.set(px, py, pz, isTip ? 'tireDust' : 'tireRubber', isTip ? 1.04 : 0.94);
                            }
                        }
                    }
                }
            }

            // 3. Black Anodized Aluminum Rim (S_MED voxels)
            const rimOuterR = tireInnerR + 0.006;
            const rMin = Math.floor(-rimOuterR / S_MED);
            const rMax = Math.ceil(rimOuterR / S_MED);
            const rimZMax = Math.ceil(halfRimW / S_MED);
            for (let ix = rMin; ix <= rMax; ix++) {
                const x = ix * S_MED;
                for (let iy = rMin; iy <= rMax; iy++) {
                    const y = iy * S_MED;
                    const r = Math.hypot(x, y);
                    if (r >= rimInnerR && r <= rimOuterR) {
                        for (let iz = -rimZMax; iz <= rimZMax; iz++) {
                            const z = iz * S_MED;
                            // Rim channel profile (thicker at beads, slightly narrower at spoke bed)
                            const edgeFactor = (r - rimInnerR) / (rimOuterR - rimInnerR);
                            const allowedZ = halfRimW * (0.72 + 0.28 * edgeFactor);
                            if (Math.abs(z) <= allowedZ) {
                                med.set(x, y, z, 'rimBlack', edgeFactor > 0.7 ? 1.15 : 0.95);
                            }
                        }
                    }
                }
            }

            // 4. Silver Aluminum Wheel Hub & Axle Bosses (S_MED voxels)
            med.addTube(0, 0, -hubWidth * 0.5, 0, 0, hubWidth * 0.5, hubR * 0.62, 'aluminum');
            // Wider spoke flanges on left and right ends of hub
            med.addTube(0, 0, -hubWidth * 0.44, 0, 0, -hubWidth * 0.30, hubR, 'aluminum');
            med.addTube(0, 0,  hubWidth * 0.30, 0, 0,  hubWidth * 0.44, hubR, 'aluminum');
            // Central steel axle nut/bolt detail
            med.addTube(0, 0, -hubWidth * 0.62, 0, 0, hubWidth * 0.62, 0.015, 'aluminumCast');

            // 5. 36 Crossed Wire Spokes (S_FINE voxels)
            const spokeCount = 36;
            for (let i = 0; i < spokeCount; i++) {
                const side = (i % 2 === 0) ? 1 : -1;
                const crossDir = ((Math.floor(i / 2) % 2) === 0) ? 1 : -1;
                const hubAng = (i / spokeCount) * Math.PI * 2;
                const rimAng = hubAng + crossDir * 0.28; // realistic 2-cross tangential lace

                const hx = Math.cos(hubAng) * (hubR * 0.88);
                const hy = Math.sin(hubAng) * (hubR * 0.88);
                const hz = side * (hubWidth * 0.38);

                const rx = Math.cos(rimAng) * (rimInnerR + 0.004);
                const ry = Math.sin(rimAng) * (rimInnerR + 0.004);
                const rz = side * 0.005;

                // Trace fine voxels cleanly along each spoke
                const steps = Math.ceil(Math.hypot(rx - hx, ry - hy, rz - hz) / (S_FINE * 0.82));
                for (let k = 0; k <= steps; k++) {
                    const t = k / steps;
                    const sx = hx + (rx - hx) * t;
                    const sy = hy + (ry - hy) * t;
                    const sz = hz + (rz - hz) * t;
                    fine.set(sx, sy, sz, 'spokeSteel', (t > 0.88) ? 1.1 : 1.0);
                }
            }

            // 6. Stainless Steel Wave / Petal Brake Rotor (S_FINE voxels)
            const discZ = discSide * (hubWidth * 0.5 + 0.012);
            const dMax = Math.ceil((discR + 0.01) / S_FINE);
            for (let ix = -dMax; ix <= dMax; ix++) {
                const x = ix * S_FINE;
                for (let iy = -dMax; iy <= dMax; iy++) {
                    const y = iy * S_FINE;
                    const r = Math.hypot(x, y);
                    const ang = Math.atan2(y, x);
                    const waveOuter = discR + Math.sin(ang * 8) * 0.005;
                    const trackInner = discR * 0.72;
                    const carrierInner = hubR * 0.75;

                    if (r >= trackInner && r <= waveOuter) {
                        // Drilled brake cooling holes
                        const holePhase = Math.sin(ang * 16) * Math.cos((r - trackInner) * 140);
                        if (holePhase < 0.72) {
                            fine.set(x, y, discZ, 'spokeSteel', 1.05);
                        }
                    } else if (r >= carrierInner && r < trackInner) {
                        // 6 curved spider arms connecting rotor track to hub
                        const arm = Math.cos(ang * 6 + r * 14);
                        if (arm > 0.58 || r < carrierInner + 0.012) {
                            fine.set(x, y, discZ, 'aluminumCast', 0.96);
                        }
                    }
                }
            }

            // 7. Rear Chain Sprocket (left side of rear wheel, S_FINE voxels)
            if (hasSprocket) {
                const spZ = -hubWidth * 0.5 - 0.014;
                const spMax = Math.ceil((sprocketR + 0.01) / S_FINE);
                for (let ix = -spMax; ix <= spMax; ix++) {
                    const x = ix * S_FINE;
                    for (let iy = -spMax; iy <= spMax; iy++) {
                        const y = iy * S_FINE;
                        const r = Math.hypot(x, y);
                        const ang = Math.atan2(y, x);
                        const teethR = sprocketR + (Math.sin(ang * 44) > 0.15 ? 0.006 : -0.002);
                        if (r >= hubR * 0.78 && r <= teethR) {
                            // Weight-saving radial cutouts in sprocket center
                            const inCutout = r > hubR * 1.15 && r < sprocketR * 0.78 && Math.cos(ang * 6) > 0.25;
                            if (!inCutout) {
                                fine.set(x, y, spZ, 'darkSteel', r > sprocketR * 0.85 ? 1.18 : 0.95);
                            }
                        }
                    }
                }
            }

            main.buildInstancedMeshes(sharedBoxGeo, materials, group);
            med.buildInstancedMeshes(sharedBoxGeo, materials, group);
            fine.buildInstancedMeshes(sharedBoxGeo, materials, group);
        }

        /**

            med.addBox(-0.165, 0.016, -0.275, -0.125, 0.028, -0.238, 'darkSteel');
